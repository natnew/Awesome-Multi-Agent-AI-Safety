name: Validate

on:
  push:
    branches: [main]
    paths: ["**.md", "scripts/**", "package.json", ".markdownlint.jsonc"]
  pull_request:
    paths: ["**.md", "scripts/**", "package.json", ".markdownlint.jsonc"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
