name: Link check

on:
  push:
    branches: [main]
    paths: ["README.md"]
  pull_request:
    paths: ["README.md"]
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check links in README
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429
            README.md
          output: ./lychee-report.md
          fail: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

      - name: Open issue for broken links (scheduled runs)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link rot report: broken links found in README"
          content-filepath: ./lychee-report.md
          labels: |
            link-rot
            maintenance
